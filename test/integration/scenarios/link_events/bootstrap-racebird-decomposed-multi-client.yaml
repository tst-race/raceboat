# Link event spec for bootstrap-racebird-decomposed-multi-client
# initial=obfs4 (single shared bidi link): listener creates 1, all connectors load 1
# final=twoSixIndirectComposition (single bidi link per client):
#   listener creates 1 for dialer, dialer loads it,
#   then listener creates 1 for dialer2, dialer2 loads it
# Exact counts. Besides the per-client final links above, the listener creates
# one shared final-recv link at startup (BootstrapListenStateMachine). The
# clients' final loads interleave with the listener's creates, so they share a
# step.
steps:
  1:
    - {node: listener, action: CREATE, channel: obfs4, slot: initial, count: 1}
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 1}
  2:
    - {node: connector, action: LOAD, channel: obfs4, slot: initial, count: 1}
  3:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 2}
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: final, count: 1}
