# connector each use a DIFFERENT plugin/channel per direction (listener
# recv=racebird/send=decomposed-exemplars; connector
# recv=decomposed-exemplars/send=racebird). There's no single "bidi channel"
# here to reason about via link_topology.py's is_single_bidi_channel() - each
# direction is its own separate physical link.
#
# Actual observed behavior (from link topology):
# - Listener creates: 2 obfs4 total (1 initial recv + 1 final bidi)
# - Listener loads: 1 twoSixIndirectComposition total (1 initial send)
# - Dialer creates: 1 twoSixIndirectComposition total (1 initial recv)
# - Dialer loads: 2 obfs4 total (1 initial send + 1 final bidi)
#
# ACTUAL TEMPORAL ORDER (from log timestamps):
# 1. listener CREATE obfs4 (initial) ~05:02:34
# 2. dialer LOAD obfs4 (initial) ~05:02:40-05:02:57 (before dialer CREATE)
# 3. dialer CREATE twoSixIndirectComposition (initial) ~05:02:57.611
# 4. listener LOAD twoSixIndirectComposition (initial) ~05:02:57.630
# 5. listener CREATE obfs4 (final) ~05:02:57.633
# 6. dialer LOAD obfs4 (final) ~05:03:07
#
# Steps ordered to satisfy cursor mechanism (step N+1 events after step N's latest):
# 1. listener CREATE initial + dialer LOAD initial (latest ~05:02:57)
# 2. dialer CREATE initial + listener LOAD initial (latest ~05:02:57.630)
# 3. listener CREATE final (latest ~05:02:57.633)
