# NEEDS AUDIT: "initial" is a genuinely mixed slot - the listener and
# connector each use a DIFFERENT plugin/channel per direction (listener
# recv=racebird/send=decomposed-exemplars; connector
# recv=decomposed-exemplars/send=racebird). There's no single "bidi channel"
# here to reason about via link_topology.py's is_single_bidi_channel() - each
# direction is its own separate physical link.
#
# Actual observed behavior (from link topology):
# - Listener creates: 2 obfs4 total (1 initial recv + 1 final bidi)
# - Listener loads: 1 twoSixIndirectComposition total (1 initial send)
# - Dialer creates: 1 twoSixIndirectComposition total (1 initial recv)
# - Dialer loads: 2 obfs4 total (1 initial send + 1 final bidi)
#
# Steps are ordered TEMPORALLY to satisfy the cursor mechanism in
# link_events.py (events in step N+1 must occur after step N's latest event):
# 1. Initial slot CREATEs (both channels)
# 2. Initial slot LOADs (both channels) - happen before final slot CREATEs
# 3. Final slot CREATE (obfs4)
# 4. Final slot LOAD (obfs4)
#
# Note: the scenario's linkDirectionOverrides key targets
# decomposed-exemplars's "final" slot, but "final" here actually uses plain
# racebird for both nodes (decomposed-exemplars only appears in "initial") -
# so the override is a no-op for this scenario, and "final" follows the plain
# default merged-bidi convention (see bootstrap-racebird-racebird.yaml).
steps:
  1:
    - {node: listener, action: CREATE, channel: obfs4, slot: initial, count: 1}
    - {node: dialer, action: CREATE, channel: twoSixIndirectComposition, slot: initial, count: 1}
  2:
    - {node: dialer, action: LOAD, channel: obfs4, slot: initial, count: 1}
    - {node: listener, action: LOAD, channel: twoSixIndirectComposition, slot: initial, count: 1}
  3:
    - {node: listener, action: CREATE, channel: obfs4, slot: final, count: 1}
  4:
    - {node: dialer, action: LOAD, channel: obfs4, slot: final, count: 1}
