# Link event spec for bootstrap-mixed-initial-downstream-c2l
#
# "initial" is a genuinely mixed slot: the listener and connector each use a
# DIFFERENT channel per direction, so each direction is its own physical link:
#   listener: recv=obfs4 (LD_LOADER_TO_CREATOR), send=twoSixIndirectComposition
#   connector: recv=twoSixIndirectComposition, send=obfs4
# twoSixIndirectComposition is overridden to LD_CREATOR_TO_LOADER, so the
# sender creates and the receiver loads on that leg. "final" is plain obfs4
# for both nodes (merged bidi link: listener creates, connector loads).
#
# Initial, upstream (connector -> listener) over obfs4 (L2C, receiver creates):
#   listener (recv) CREATE obfs4, connector (send) LOAD obfs4
# Initial, downstream (listener -> connector) over twoSix (C2L, sender creates):
#   listener (send) CREATE twoSixIndirectComposition,
#   connector (recv) LOAD twoSixIndirectComposition
# Final (merged bidi obfs4): listener CREATE, connector LOAD
#
# Steps follow the observed temporal order (a step's events must come after
# the latest event of the previous step).
steps:
  1:
    - {node: listener, action: CREATE, channel: obfs4, slot: initial, count: 1}
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: initial, count: 1}
  2:
    - {node: dialer, action: LOAD, channel: obfs4, slot: initial, count: 1}
    - {node: dialer, action: LOAD, channel: twoSixIndirectComposition, slot: initial, count: 1}
  3:
    - {node: listener, action: CREATE, channel: obfs4, slot: final, count: 1}
  4:
    - {node: dialer, action: LOAD, channel: obfs4, slot: final, count: 1}
