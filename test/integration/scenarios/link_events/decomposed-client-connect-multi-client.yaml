# Client-connect mode (2 connectors) with a shared listen address. See
# decomposed-client-connect.yaml for the per-channel reasoning. The listener
# creates its 2 links once and reuses them for every subsequent accept(), so a
# second client adds no CREATE. `connector` (role keyword) auto-expands to each
# of dialer/dialer2, each expecting 2 loads.
steps:
  1:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, count: 2}
  2:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, count: 2}
