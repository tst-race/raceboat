# Link event spec for scenarios/bootstrap-decomposed-decomposed-forced-final-c2l.json
#
# The initial channel (twoSixIndirectComposition) is LD_BIDI: the listener
# creates it and the connector loads it.
# The final channel (twoSixIndirectCompositionFile) is overridden to
# LD_CREATOR_TO_LOADER, so on each final leg the sender creates and the receiver
# loads:
#   final send, listener -> connector: listener (sender) CREATEs, connector (receiver) LOADs
#   final send, connector -> listener: connector (sender) CREATEs, listener (receiver) LOADs
# i.e. one CREATE and one LOAD per side. The listener creates its final send
# link at startup, before any hello arrives; the connector creates its own when
# it processes the response. Steps follow that temporal order.
steps:
  1:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: initial, count: 1}
    - {node: listener, action: CREATE, channel: twoSixIndirectCompositionFile, slot: final, count: 1}
  2:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: initial, count: 1}
  3:
    - {node: connector, action: CREATE, channel: twoSixIndirectCompositionFile, slot: final, count: 1}
  4:
    - {node: listener, action: LOAD, channel: twoSixIndirectCompositionFile, slot: final, count: 1}
  5:
    - {node: connector, action: LOAD, channel: twoSixIndirectCompositionFile, slot: final, count: 1}
