# Best-effort default convention for client-connect mode: the listener
# (server) creates its listen link(s), the connector (client) loads them.
# decomposed-exemplars (LD_BIDI) uses a single bidirectional link for the
# "channel" slot, so there is 1 link (the adapter passes only the one address).
steps:
  1:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, count: 1}
  2:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, count: 1}
