# Best-effort default-convention spec (2 connectors, no linkDirectionOverrides).
# For the initial slot, the bootstrap handshake merges bidi into a single
# shared link: listener creates 1, each connector loads 1.
# For the final slot, send and recv directions are separate physical links:
# 2 per client, so listener creates 4 (2 per client * 2 clients), each
# connector loads 2.
steps:
  1:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: initial, count: 1}
  2:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: initial, count: 1}
  3:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 4}
  4:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: final, count: 2}
