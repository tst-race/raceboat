# Best-effort default-convention spec (2 connectors, no linkDirectionOverrides).
# See bootstrap-decomposed-decomposed.yaml for the general reasoning; the only
# difference here is `listener` aggregates 2 links/connector * 2 connectors = 4
# for each slot, while `connector` (role keyword) auto-expands to each of
# dialer/dialer2 independently, each expecting 2 loads.
steps:
  1:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: initial, count: 4}
  2:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: initial, count: 2}
  3:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 4}
  4:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: final, count: 2}
