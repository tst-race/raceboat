# Link event spec for bootstrap-decomposed-decomposed-multi-client
# With single bidirectional links on LD_BIDI channels:
# - Initial slot: listener creates 1 bidi link, each connector loads 1
# - Final slot: listener creates 1 bidi link PER CLIENT, each connector loads 1
steps:
  1:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: initial, count: 1}
  2:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: initial, count: 1}
  3:
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 2}
  4:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: final, count: 1}