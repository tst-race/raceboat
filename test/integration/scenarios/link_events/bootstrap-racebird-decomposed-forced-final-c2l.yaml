# Link event spec for bootstrap-racebird-decomposed-forced-final-c2l
#
# "final" is twoSixIndirectComposition forced to LD_CREATOR_TO_LOADER, so on each
# final leg the sender creates and the receiver loads (this is not a merged
# bidi link):
#   final send, listener -> connector: listener (sender) CREATEs,  connector (receiver) LOADs
#   final send, connector -> listener: connector (sender) CREATEs, listener (receiver) LOADs
# i.e. one CREATE and one LOAD per side. The listener creates its final send
# link at startup, before any hello arrives; the connector creates its own
# when it processes the hello. "initial" is plain obfs4 (listener creates,
# connector loads). Steps follow that temporal order.
steps:
  1:
    - {node: listener, action: CREATE, channel: obfs4, slot: initial, count: 1}
    - {node: listener, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 1}
  2:
    - {node: connector, action: LOAD, channel: obfs4, slot: initial, count: 1}
  3:
    - {node: connector, action: CREATE, channel: twoSixIndirectComposition, slot: final, count: 1}
  4:
    - {node: listener, action: LOAD, channel: twoSixIndirectComposition, slot: final, count: 1}
  5:
    - {node: connector, action: LOAD, channel: twoSixIndirectComposition, slot: final, count: 1}
