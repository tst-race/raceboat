# Client-connect mode (2 connectors) with a shared listen address. The listener
# creates its listen link once; ListenStateMachine reuses that link for every
# subsequent accept(), so a second client adds no CREATE. obfs4 (racebird,
# LD_BIDI+TT_UNICAST) merges send/recv into a single physical link => 1 CREATE.
# `connector` (role keyword) auto-expands to each of dialer/dialer2, each
# expecting 1 load.
steps:
  1:
    - {node: listener, action: CREATE, channel: obfs4, count: 1}
  2:
    - {node: connector, action: LOAD, channel: obfs4, count: 1}
