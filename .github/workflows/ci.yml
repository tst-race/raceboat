name: Continuous Integration

on:
  push:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  builder-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/raceboat-builder
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Configure Docker Caching
        id: cache
        uses: int128/docker-build-cache-config-action@v1
        with:
          image: ghcr.io/${{ github.repository }}/raceboat-builder/cache

      - name: Build and Push raceboat-builder Docker Image
        uses: docker/build-push-action@v4
        with:
          context: raceboat-builder-image
          file: raceboat-builder-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}

  build-framework:
    needs: [builder-image]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tst-race/raceboat/raceboat-builder:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: ./build.sh

      - name: Create Build Artifact
        run: "tar cvf ${{ github.event.repository.name }}.tar.gz -C /__w/raceboat/raceboat/ ./racesdk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.repository.name }}.tar.gz"
          path: "${{ github.event.repository.name }}.tar.gz"
          retention-days: 10

  plugin-builder-image:
    needs: [build-framework]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Framework Artifacts
        uses: actions/download-artifact@v4
        with:
          name: "${{ github.event.repository.name }}.tar.gz"

      - name: debug ls
        run: ls -R .

      - name: untar 
        run: tar xf ${{ github.event.repository.name }}.tar.gz

      - name: debug ls
        run: ls -R racesdk

      - name: debu pwdg
        run: pwd

      - name: env
        run: env
 
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/raceboat-plugin-builder
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Configure Docker Caching
        id: cache
        uses: int128/docker-build-cache-config-action@v1
        with:
          image: ghcr.io/${{ github.repository }}/raceboat-plugin-builder/cache

      - name: Build and Push raceboat-plugin-builder Docker Image
        uses: docker/build-push-action@v4
        with:
          context: /home/runner/work/raceboat/raceboat
          file: raceboat-plugin-builder-image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          build-contexts: ghcr.io/tst-race/raceboat/raceboat-builder=docker-image://ghcr.io/tst-race/raceboat/raceboat-builder:${{ steps.meta.outputs.version }}

  run-tests:
    needs: [plugin-builder-image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tst-race/raceboat/raceboat-plugin-builder:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test
        run: ./test.sh

  runtime-image:
    needs: [plugin-builder-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Framework Artifacts
        uses: actions/download-artifact@v4
        with:
          name: "${{ github.event.repository.name }}.tar.gz"

      - name: debug ls
        run: ls -R .

      - name: untar 
        run: tar xf ${{ github.event.repository.name }}.tar.gz

      - name: debug ls
        run: ls -R racesdk

      - name: debu pwdg
        run: pwd

      - name: env
        run: env
 
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/raceboat-runtime
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Configure Docker Caching
        id: cache
        uses: int128/docker-build-cache-config-action@v1
        with:
          image: ghcr.io/${{ github.repository }}/raceboat-runtime/cache

      - name: Build and Push raceboat-runtime Docker Image
        uses: docker/build-push-action@v4
        with:
          context: /home/runner/work/raceboat/raceboat
          file: raceboat-runtime-image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          build-contexts: ghcr.io/tst-race/raceboat/raceboat-plugin-builder=docker-image://ghcr.io/tst-race/raceboat/raceboat-plugin-builder:${{ steps.meta.outputs.version }}

  # Builds the racebird/decomposed-exemplars plugin kits needed by
  # test/integration's scenario suite (test/integration/plugin_registry.json
  # expects them checked out as siblings of raceboat) - built once here,
  # inside the plugin-builder image (same toolchain each plugin's own CI
  # uses), and handed off as artifacts so integration-tests doesn't need a
  # container job itself (it needs a real docker daemon for docker compose).
  plugin-artifacts:
    needs: [plugin-builder-image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tst-race/raceboat/raceboat-plugin-builder:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    strategy:
      matrix:
        include:
          - plugin: racebird
            ref: main
          # test/adapter.py (needed by test/integration/generate_scenario.py)
          # only exists on integration-testing, not yet merged to main.
          - plugin: decomposed-exemplars
            ref: integration-testing
    steps:
      - name: Checkout ${{ matrix.plugin }}
        uses: actions/checkout@v3
        with:
          repository: tst-race/${{ matrix.plugin }}
          ref: ${{ matrix.ref }}
          path: plugins/${{ matrix.plugin }}

      - name: Build ${{ matrix.plugin }} artifacts
        working-directory: plugins/${{ matrix.plugin }}
        env:
          GOFLAGS: "-buildvcs=false"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/plugins/${{ matrix.plugin }}"
          ./build_artifacts.sh

      - name: Create Build Artifact
        working-directory: plugins/${{ matrix.plugin }}
        run: tar czf "${{ matrix.plugin }}-kit.tar.gz" ./kit

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.plugin }}-kit"
          path: "plugins/${{ matrix.plugin }}/${{ matrix.plugin }}-kit.tar.gz"
          retention-days: 1

  integration-tests:
    needs: [runtime-image, plugin-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout raceboat
        uses: actions/checkout@v3
        with:
          path: raceboat

      - name: Checkout racebird
        uses: actions/checkout@v3
        with:
          repository: tst-race/racebird
          path: plugins/racebird

      - name: Checkout decomposed-exemplars
        uses: actions/checkout@v3
        with:
          repository: tst-race/decomposed-exemplars
          # test/adapter.py only exists on integration-testing, not yet merged to main.
          ref: integration-testing
          path: plugins/decomposed-exemplars

      - name: Download racebird build artifact
        uses: actions/download-artifact@v4
        with:
          name: racebird-kit
          path: plugins/racebird

      - name: Download decomposed-exemplars build artifact
        uses: actions/download-artifact@v4
        with:
          name: decomposed-exemplars-kit
          path: plugins/decomposed-exemplars

      - name: Extract plugin kits
        run: |
          tar xzf plugins/racebird/racebird-kit.tar.gz -C plugins/racebird
          tar xzf plugins/decomposed-exemplars/decomposed-exemplars-kit.tar.gz -C plugins/decomposed-exemplars

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python test dependencies
        run: pip install --quiet pyyaml

      - name: Run scenario integration test suite
        working-directory: raceboat/test/integration
        run: |
          python3 run_all_scenarios.py \
            --image-tag "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}" \
            --fail-fast \
            --skip bootstrap-decomposed-decomposed-forced-final-c2l

      - name: Run standalone shared-address/timeout-zero tests
        working-directory: raceboat/test/integration
        run: |
          IMAGE_TAG="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"
          python3 test-shared-upstream-downstream-hashtags.py --image-tag "$IMAGE_TAG"
          python3 test-timeout-zero-teardown.py --image-tag "$IMAGE_TAG"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: raceboat/test/integration/generated
          retention-days: 5
